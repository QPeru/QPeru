<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <radialGradient id="gradQubit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#961d1e" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="500" height="300" fill="#1b1e1f" rx="12" />
  <g transform="translate(250, 150)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#30363d" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3" />
    <ellipse cx="0" cy="0" rx="22" ry="70" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#30363d" stroke-width="1" />
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#30363d" stroke-width="1" />
    <path d="M -60 20 Q 0 -40, 60 -20 Q 0 40, -60 20" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.5" />
    <g filter="url(#glow)">
      <circle cx="0" cy="0" r="9" fill="url(#gradQubit)">
        <animateMotion path="M -60 20 Q 0 -40, 60 -20 Q 0 40, -60 20" dur="5s" repeatCount="indefinite" />
      </circle>
    </g>
    <text x="-130" y="-100" font-family="monospace" font-size="13" fill="#c2a46e" font-weight="bold">|ψ⟩ Quantum State Evolution</text>
  </g>
</svg>
